<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="badgeGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="accentGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fecdd3" />
    </linearGradient>
    <filter id="shadowMask" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable compliance -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Scaled content within the safe central 80% circle (center at 256,256 with 0.76 scale) -->
  <g transform="translate(256, 256) scale(0.76) translate(-256, -256)">
    <!-- ID Badge Lanyard / Clip -->
    <path d="M 232 44 L 280 44 L 274 72 L 238 72 Z" fill="#ffffff" opacity="0.9" />
    <rect x="246" y="68" width="20" height="24" rx="4" fill="#cbd5e1" />

    <!-- Main ID Card / Attendance Frame -->
    <g filter="url(#shadowMask)">
      <rect x="96" y="86" width="320" height="340" rx="32" fill="#ffffff" />
      <!-- Header of card -->
      <path d="M 96 118 Q 96 86 128 86 L 384 86 Q 416 86 416 118 L 416 160 L 96 160 Z" fill="url(#badgeGradMask)" />
      
      <!-- Lanyard hole -->
      <rect x="232" y="98" width="48" height="12" rx="6" fill="#450a0a" opacity="0.3" />

      <!-- Card Header Text / Lines -->
      <rect x="146" y="126" width="220" height="8" rx="4" fill="#ffffff" opacity="0.9" />
      <rect x="180" y="140" width="152" height="6" rx="3" fill="#fecdd3" opacity="0.8" />

      <!-- Avatar Placeholder / Photo area -->
      <circle cx="160" cy="225" r="38" fill="#f8fafc" stroke="#fca5a5" stroke-width="3" />
      <!-- Teacher silhouette -->
      <path d="M 144 218 A 16 16 0 1 1 176 218 A 16 16 0 1 1 144 218 Z" fill="#991b1b" />
      <path d="M 132 250 C 132 236 144 232 160 232 C 176 232 188 236 188 250 Z" fill="#991b1b" />

      <!-- QR Code Scan Box area -->
      <rect x="230" y="185" width="150" height="150" rx="16" fill="#f8fafc" stroke="#fee2e2" stroke-width="2" />
      <!-- Top Left -->
      <rect x="244" y="199" width="36" height="36" rx="6" fill="#991b1b" />
      <rect x="250" y="205" width="24" height="24" rx="3" fill="#ffffff" />
      <rect x="256" y="211" width="12" height="12" rx="2" fill="#991b1b" />

      <!-- Top Right -->
      <rect x="330" y="199" width="36" height="36" rx="6" fill="#991b1b" />
      <rect x="336" y="205" width="24" height="24" rx="3" fill="#ffffff" />
      <rect x="342" y="211" width="12" height="12" rx="2" fill="#991b1b" />

      <!-- Bottom Left -->
      <rect x="244" y="285" width="36" height="36" rx="6" fill="#991b1b" />
      <rect x="250" y="291" width="24" height="24" rx="3" fill="#ffffff" />
      <rect x="256" y="297" width="12" height="12" rx="2" fill="#991b1b" />

      <!-- QR Inner Bits -->
      <rect x="290" y="205" width="10" height="10" rx="2" fill="#dc2626" />
      <rect x="306" y="205" width="10" height="10" rx="2" fill="#991b1b" />
      <rect x="290" y="222" width="14" height="14" rx="3" fill="#991b1b" />
      <rect x="310" y="244" width="12" height="12" rx="2" fill="#dc2626" />
      <rect x="290" y="264" width="10" height="10" rx="2" fill="#991b1b" />
      <rect x="244" y="250" width="12" height="12" rx="2" fill="#991b1b" />
      <rect x="332" y="250" width="14" height="14" rx="2" fill="#dc2626" />
      <rect x="352" y="270" width="12" height="12" rx="2" fill="#991b1b" />
      <rect x="290" y="295" width="14" height="14" rx="3" fill="#dc2626" />
      <rect x="312" y="295" width="10" height="10" rx="2" fill="#991b1b" />

      <!-- Card details text bars -->
      <rect x="126" y="282" width="70" height="8" rx="4" fill="#b91c1c" />
      <rect x="126" y="298" width="55" height="6" rx="3" fill="#e2e8f0" />
      <rect x="126" y="312" width="85" height="6" rx="3" fill="#cbd5e1" />

      <!-- Bottom Card Info Bar -->
      <rect x="126" y="360" width="260" height="38" rx="12" fill="#fff1f2" />
      <text x="256" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">SDN KECIL OGOMOJOLO</text>
    </g>

    <!-- Verified Attendance Checkmark Badge -->
    <g filter="url(#shadowMask)">
      <circle cx="390" cy="385" r="48" fill="url(#accentGradMask)" stroke="#ffffff" stroke-width="6" />
      <path d="M 370 385 L 384 399 L 412 371" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Graduation Cap / Education Symbol -->
    <g filter="url(#shadowMask)">
      <circle cx="106" cy="116" r="38" fill="url(#goldGradMask)" stroke="#b91c1c" stroke-width="3" />
      <polygon points="106,96 130,107 106,118 82,107" fill="#b91c1c" />
      <path d="M 90 114 L 90 128 Q 106 138 122 128 L 122 114" fill="#b91c1c" />
      <path d="M 124 109 L 132 124" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>
</svg>
